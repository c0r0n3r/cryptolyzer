image: python

stages:
- lint
- offlinetest
- livetest
- deploy

before_script:
- apt-get update && apt-get install --no-install-recommends -y git-core
- pip install uv
- uv sync --extra tests

variables:
  GIT_SUBMODULE_DEPTH: 1
  GIT_SUBMODULE_STRATEGY: recursive
  PYTHONPATH: "submodules/cryptoparser:submodules/cryptoparser/submodules/cryptodatahub"
  UV_PYTHON_DOWNLOADS: "never"
  UV_PYTHON_PREFERENCE: "only-system"

.test:
  variables:
    CRYPTOLYZER_TEST_SKIP_LIVE_SERVER: "1"
    CRYPTOLYZER_TEST_SKIP_LIVE_DNS: "1"
  script:
  - uv run coverage run -m unittest discover -v
  - uv run coverage report

.live_test:
  stage: livetest
  script:
  - uv run python -m unittest test.live -v

pylint:
  image: python:3.14-slim
  stage: lint
  script:
  - uv run --with pylint pylint --rcfile .pylintrc cryptolyzer docs test

ruff:
  image: python:3.14-slim
  stage: lint
  script: uvx ruff check cryptolyzer docs test

python314:
  extends: .test
  image: python:3.14-slim
  stage: offlinetest

python39:
  extends: .test
  image: python:3.9-slim
  stage: offlinetest

python310:
  extends: .test
  image: python:3.10-slim
  stage: offlinetest

python311:
  extends: .test
  image: python:3.11-slim
  stage: offlinetest

python312:
  extends: .test
  image: python:3.12-slim
  stage: offlinetest

python313:
  extends: .test
  image: python:3.13-slim
  stage: offlinetest

pythonrc:
  extends: .test
  image: python:3.15-rc-slim
  stage: offlinetest

live:
  extends: .live_test
  image: python:3.14-slim

coveralls:
  image: python:3.12-slim
  variables:
    CI_NAME: gitlab
    CI_BUILD_NUMBER: "${CI_JOB_ID}"
    CI_BUILD_URL: "${CI_JOB_URL}"
    CI_BRANCH: "${CI_COMMIT_REF_NAME}"
    GIT_SUBMODULE_DEPTH: 1
    GIT_SUBMODULE_STRATEGY: recursive
    PYTHONPATH: "submodules/cryptoparser:submodules/cryptoparser/submodules/cryptodatahub"
  stage: deploy
  script:
    - uv run coverage run -m unittest -v -f
    - uv run --with coveralls coveralls
  only:
    refs:
      - master

dockerhub:
  image: quay.io/podman/stable:latest
  stage: deploy
  variables:
    DOCKER_NAME: docker.io/${CI_REGISTRY_USER}/${CI_PROJECT_NAME}
    GIT_SUBMODULE_STRATEGY: recursive
    STORAGE_DRIVER: vfs
  before_script:
    - if ! [ -z ${CI_COMMIT_TAG} ] ; then DOCKER_NAME="${DOCKER_NAME}:${CI_COMMIT_TAG}" ; fi
    - echo "${CI_REGISTRY_PASSWORD}" | podman login -u "${CI_REGISTRY_USER}" --password-stdin docker.io
  script:
    - podman build -t "$DOCKER_NAME" .
    - podman push "$DOCKER_NAME"
  only:
    refs:
      - branches
      - tags
    variables:
      - $CI_COMMIT_TAG =~ /^v\d+.\d+.\d+$/
      - $CI_COMMIT_REF_NAME == "master"

obs:
  image:
    name: coroner/python_obs:1.2.5
    pull_policy: always
  stage: deploy
  variables:
    GIT_SUBMODULE_DEPTH: 1
    GIT_SUBMODULE_STRATEGY: recursive
  before_script: []
  script:
    - obs.sh
  only:
    refs:
      - master
      - tags
    variables:
      - $CI_COMMIT_TAG =~ /^v\d+.\d+.\d+$/
      - $CI_COMMIT_REF_NAME == "master"
